name: KAEL Python tests

on:
  push:
    paths:
      - "kael-python/**"
  pull_request:
    paths:
      - "kael-python/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check whether the source has been synchronized
        id: source-check
        shell: bash
        run: |
          if [ -f kael-python/app/lead_worker.py ] && [ -f kael-python/requirements.txt ] && [ -d kael-python/tests ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.source-check.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kael-python/requirements.txt
      - name: Install dependencies
        if: steps.source-check.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r kael-python/requirements.txt
      - name: Run tests
        if: steps.source-check.outputs.ready == 'true'
        working-directory: kael-python
        run: python -m pytest -q
      - name: Explain why tests were skipped
        if: steps.source-check.outputs.ready != 'true'
        run: echo "The KAEL source folder is a scaffold until sync_from_local.py uploads the full, tested source." >> "$GITHUB_STEP_SUMMARY"
