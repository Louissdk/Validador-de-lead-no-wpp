name: KAEL Python tests

on:
  push:
    paths:
      - "kael-python/**"
      - ".github/workflows/kael-python-tests.yml"
  pull_request:
    paths:
      - "kael-python/**"
      - ".github/workflows/kael-python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kael-python/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r kael-python/requirements.txt
      - name: Run tests
        working-directory: kael-python
        run: python -m pytest -q
