services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kael
      POSTGRES_USER: kael
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - kael-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kael -d kael"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - kael-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    command: ["python", "-m", "app", "worker"]
    restart: unless-stopped
  api:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    command: ["python", "-m", "app", "serve", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
volumes:
  kael-postgres:
  kael-redis:
